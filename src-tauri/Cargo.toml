[package]
name = "music-desktop"
version = "0.1.23"
description = "Online music desktop player (Tauri + Vue3)"
authors = ["hsg"]
edition = "2021"

[lib]
name = "music_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSGraphics",
  "NSScreen",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry"] }
